# LLM2-Lab — FLRM multi-escala: 2.167.308 parâmetros no backbone deste perfil.
# Perfil T4 FP32; duração depende dos dados, hardware e limites de passos/tempo.
model:
  vocab_size: 257
  d_model: 384
  n_layers: 6  # Campo do Transformer; no FLRM, a profundidade usa research.core_layers.
  n_heads: 6
  hidden_dim: 1024
  max_seq_len: 256
  dropout: 0.05
data:
  path: ../data/processed-real
  seq_len: 256
  batch_size: 8
  eval_batch_size: 8
optimizer:
  lr: 0.0004
  min_lr_ratio: 0.1
  weight_decay: 0.05
  warmup_steps: 50
  schedule_steps: 2000
train:
  seed: 42
  device: cuda
  precision: fp32
  deterministic: false
  compile: false
  max_steps: 2000
  grad_accum_steps: 4
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 8
  checkpoint_interval: 200
  log_interval: 20
  output_dir: ../runs/kaggle-1h-fractal
  cpu_threads: 2
research:
  architecture: fractal
  core_layers: 1  # Padrão anterior, agora explícito; não altera o modelo resolvido.
  iterations: 1
  jepa_weight: 0.1
  share_scales: true
  scale_conditioning: true
  max_seconds: 1800.0
  shutdown_reserve_seconds: 30.0
