# Frozen from campaign 0016; cycle2 runner resolves all six arms and seed blocks.
data:
  batch_size: 32
  eval_batch_size: 8
  path: ../../../data/cycle2
  seq_len: 256
model:
  d_model: 384
  dropout: 0.05
  hidden_dim: 1024
  max_seq_len: 256
  n_heads: 6
  n_layers: 6
  norm_eps: 1.0e-06
  rope_theta: 10000.0
  vocab_size: 257
optimizer:
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  lr: 0.0004
  min_lr_ratio: 0.1
  schedule_steps: 2000
  warmup_steps: 50
  weight_decay: 0.05
research:
  architecture: fractal
  cache_context_projection: true
  context_normalization: none
  core_layers: 1
  cross_scale_exchange: true
  curriculum: 'off'
  curriculum_interval: 20
  detach_every: 0
  ema_decay: 0.99
  exploration: 0.1
  fixed_curriculum_steps: 100
  fused_film: false
  gradient_checkpointing: false
  intermediate_weight: 0.0
  inv_vcycle: false
  iterations: 2
  jepa_hidden_only: true
  jepa_offset: 1
  jepa_weight: 0.0
  latent_steps: 0
  latent_warmup_steps: 0
  lm_weight: 1.0
  max_difficulty: 3
  max_seconds: 0.0
  max_tokens: 0
  max_train_flops: 0
  mtp_tokens: 0
  mtp_weight: 0.0
  ncm_slots: 0
  paired_common_init: true
  planning_only: false
  probe_examples: 2
  record_states: false
  scale_conditioning: true
  scale_execution: compressed_native
  scales:
  - 1
  - 4
  - 0
  share_scales: true
  share_weights: true
  shutdown_reserve_seconds: 0.0
  text_fraction: 0.5
  use_ema: true
  v_cycle: false
  variance_target: 0.5
  variance_weight: 0.1
train:
  accumulation_weighting: tokens
  checkpoint_interval: 500
  compile: true
  compile_backend: inductor
  console_progress: true
  cpu_threads: 2
  deterministic: false
  device: cuda
  eval_batches: 8
  eval_interval: 100
  grad_accum_steps: 1
  grad_clip: 1.0
  log_interval: 20
  max_steps: 2000
  output_dir: ../../../runs/cycle2-individual
  precision: fp32
  seed: 81
