# Ciclo 1 - Variante 1: Transformer da campanha 0015 (Baseline de controle)
# Parâmetros únicos calculados: 2.164.224
model:
  vocab_size: 257
  d_model: 384
  n_layers: 1
  n_heads: 6
  hidden_dim: 1280
  max_seq_len: 256
  dropout: 0.05
data:
  path: ../../../data/processed-byte
  seq_len: 256
  batch_size: 32
  eval_batch_size: 32
optimizer:
  lr: 0.0004
  min_lr_ratio: 0.1
  weight_decay: 0.05
  warmup_steps: 50
  schedule_steps: 2000
train:
  seed: 71
  device: cuda
  precision: fp32
  deterministic: false
  compile: true
  max_steps: 2000
  grad_accum_steps: 1
  grad_clip: 1.0
  eval_interval: 500
  eval_batches: 8
  checkpoint_interval: 500
  log_interval: 20
  output_dir: ../../../runs/cycle1/c1_v1_baseline_small
  cpu_threads: 2
  accumulation_weighting: tokens
research:
  architecture: transformer
