# Opt-in engineering configuration; no scientific performance result.
model:
  vocab_size: 257
  d_model: 64
  n_layers: 2
  n_heads: 4
  hidden_dim: 128
  max_seq_len: 128
  dropout: 0.1
data:
  path: ../../data/processed-byte
  seq_len: 128
  batch_size: 1
  eval_batch_size: 2
optimizer:
  lr: 0.001
  warmup_steps: 1
  schedule_steps: 20
train:
  device: cpu
  precision: fp32
  deterministic: true
  seed: 42
  max_steps: 4
  grad_accum_steps: 1
  eval_interval: 2
  eval_batches: 2
  checkpoint_interval: 2
  log_interval: 1
  output_dir: ../../runs/research-v2/c4_lrm_adaptive
  cpu_threads: 1
research:
  architecture: recursive
  max_train_flops: 2000000000
  jepa_weight: 0.1
  curriculum: adaptive
  max_difficulty: 1
  curriculum_interval: 2
  probe_examples: 1
  text_fraction: 0.5
