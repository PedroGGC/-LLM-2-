# LLM2-Lab — LRM Puro (Recursão Causal + JEPA sem multiescala) - Treino Real T4
# Ablação de referência direta contra o FLRM (mesmo d_model, layers, lr e JEPA).
model:
  vocab_size: 257
  d_model: 384
  n_layers: 6
  n_heads: 6
  hidden_dim: 1024
  max_seq_len: 256
  dropout: 0.05
data:
  path: ../data/processed-real
  seq_len: 256
  batch_size: 8
  eval_batch_size: 8
optimizer:
  lr: 0.0004
  min_lr_ratio: 0.1
  weight_decay: 0.05
  warmup_steps: 50
  schedule_steps: 2000
train:
  seed: 42
  device: cuda
  precision: fp32
  deterministic: false
  compile: false
  max_steps: 2000
  grad_accum_steps: 4
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 8
  checkpoint_interval: 200
  log_interval: 20
  output_dir: ../runs/kaggle-1h-lrm
  cpu_threads: 2
research:
  architecture: recursive
  iterations: 1
  jepa_weight: 0.1
  latent_steps: 1
  max_seconds: 1800.0
  shutdown_reserve_seconds: 30.0
