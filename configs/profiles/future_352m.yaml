# Opt-in engineering configuration; no scientific performance result.
model:
  vocab_size: 8192
  d_model: 1536
  n_layers: 12
  n_heads: 24
  hidden_dim: 4096
  max_seq_len: 512
  dropout: 0.1
data:
  path: ../../data/processed-bpe
  seq_len: 512
  batch_size: 1
  eval_batch_size: 1
optimizer:
  lr: 0.001
  warmup_steps: 1
  schedule_steps: 20
train:
  device: cuda
  precision: bf16
  deterministic: false
  seed: 42
  max_steps: 4
  grad_accum_steps: 1
  eval_interval: 2
  eval_batches: 2
  checkpoint_interval: 2
  log_interval: 1
  output_dir: ../../runs/profiles/future_352m
  cpu_threads: 1
research:
  architecture: transformer
  max_seconds: 1800.0
  shutdown_reserve_seconds: 60.0
  planning_only: true
