# Opt-in engineering configuration; no scientific performance result.
model:
  vocab_size: 8192
  d_model: 512
  n_layers: 9
  n_heads: 8
  hidden_dim: 1472
  max_seq_len: 512
  dropout: 0.1
data:
  path: ../../data/processed-bpe
  seq_len: 512
  batch_size: 1
  eval_batch_size: 1
optimizer:
  lr: 0.0003
  warmup_steps: 100
  schedule_steps: 2000
train:
  device: cuda
  precision: bf16
  deterministic: false
  seed: 42
  max_steps: 1000
  grad_accum_steps: 4
  eval_interval: 100
  eval_batches: 2
  checkpoint_interval: 100
  log_interval: 10
  output_dir: ../../runs/profiles/a100_34m
  cpu_threads: 1
research:
  architecture: transformer
  max_seconds: 1800.0
  shutdown_reserve_seconds: 60.0
